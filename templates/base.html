<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}견적서 관리{% endblock %} | 샤시크루</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
      <i class="bi bi-building-gear me-2 text-primary"></i>샤시크루
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}"
             href="{{ url_for('index') }}">
            <i class="bi bi-house me-1"></i>홈
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'items' %}active{% endif %}"
             href="{{ url_for('items') }}">
            <i class="bi bi-list-ul me-1"></i>품목 관리
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'new_quote' %}active{% endif %}"
             href="{{ url_for('new_quote') }}">
            <i class="bi bi-file-earmark-plus me-1"></i>견적서 작성
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'quote_list' %}active{% endif %}"
             href="{{ url_for('quote_list') }}">
            <i class="bi bi-clock-history me-1"></i>견적 이력
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}"
             href="{{ url_for('settings') }}">
            <i class="bi bi-gear me-1"></i>설정
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid px-4 py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
