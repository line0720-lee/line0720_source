{% extends "base.html" %}
{% block title %}설정{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h4 class="fw-bold mb-4"><i class="bi bi-gear me-2 text-primary"></i>시스템 설정</h4>

    <form method="POST" action="{{ url_for('settings') }}">
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white border-bottom pt-3">
          <h6 class="fw-bold mb-0 text-primary"><i class="bi bi-building me-2"></i>회사 정보</h6>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">회사명 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" name="company_name"
                   value="{{ cfg.company_name }}" placeholder="예: OO샤시 공장">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">주소</label>
            <input type="text" class="form-control" name="address"
                   value="{{ cfg.address }}" placeholder="예: 경기도 화성시 ...">
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">전화번호</label>
              <input type="text" class="form-control" name="phone"
                     value="{{ cfg.phone }}" placeholder="031-000-0000">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">휴대폰</label>
              <input type="text" class="form-control" name="fax"
                     value="{{ cfg.fax }}" placeholder="010-0000-0000">
            </div>
          </div>
          <div class="mt-3">
            <label class="form-label fw-semibold">담당자</label>
            <input type="text" class="form-control" name="manager"
                   value="{{ cfg.manager }}" placeholder="홍길동">
          </div>
          <div class="mt-3">
            <label class="form-label fw-semibold">계좌번호</label>
            <input type="text" class="form-control" name="bank_account"
                   value="{{ cfg.bank_account }}" placeholder="예: 국민은행 123-456-789012 홍길동">
          </div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-check-lg me-2"></i>저장
        </button>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary px-4">취소</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
