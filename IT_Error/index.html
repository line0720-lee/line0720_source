<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>전산도우미</title>
  <style>
    /* ── 토큰 ──────────────────────────────── */
    :root {
      --bg:           #EEF2F7;
      --surface:      #FFFFFF;
      --header:       #1C2B3A;
      --header-b:     #243447;
      --accent:       #2563EB;
      --accent-h:     #1D4ED8;
      --user-bg:      #2563EB;
      --user-txt:     #FFFFFF;
      --bot-bg:       #FFFFFF;
      --bot-shadow:   0 1px 4px rgba(0,0,0,.09);
      --sys-bg:       #E2E8F0;
      --sys-txt:      #475569;
      --text:         #1E293B;
      --muted:        #64748B;
      --border:       #DDE3EB;
      --fbar:         #F8FAFC;
      --input-bg:     #FFFFFF;
      --cite-bg:      #DBEAFE;
      --cite-txt:     #1D4ED8;
      --ret-bg:       #F0F6FF;
      --ret-border:   #BFDBFE;
      --online:       #22C55E;
      --offline:      #EF4444;
      --checking:     #F59E0B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #0D1520;
        --surface:    #162030;
        --header:     #0D1520;
        --header-b:   #1A2B3D;
        --accent:     #3B82F6;
        --accent-h:   #60A5FA;
        --user-bg:    #2563EB;
        --user-txt:   #FFFFFF;
        --bot-bg:     #1C2D40;
        --bot-shadow: 0 1px 4px rgba(0,0,0,.4);
        --sys-bg:     #1C2D40;
        --sys-txt:    #94A3B8;
        --text:       #E2E8F0;
        --muted:      #94A3B8;
        --border:     #243447;
        --fbar:       #111D2B;
        --input-bg:   #162030;
        --cite-bg:    #1E3A5F;
        --cite-txt:   #93C5FD;
        --ret-bg:     #162030;
        --ret-border: #1E3A5F;
      }
    }
    :root[data-theme="light"] {
      --bg:#EEF2F7;--surface:#FFFFFF;--header:#1C2B3A;--header-b:#243447;
      --accent:#2563EB;--accent-h:#1D4ED8;--user-bg:#2563EB;--user-txt:#FFFFFF;
      --bot-bg:#FFFFFF;--bot-shadow:0 1px 4px rgba(0,0,0,.09);
      --sys-bg:#E2E8F0;--sys-txt:#475569;--text:#1E293B;--muted:#64748B;
      --border:#DDE3EB;--fbar:#F8FAFC;--input-bg:#FFFFFF;
      --cite-bg:#DBEAFE;--cite-txt:#1D4ED8;--ret-bg:#F0F6FF;--ret-border:#BFDBFE;
      --online:#22C55E;--offline:#EF4444;--checking:#F59E0B;
    }
    :root[data-theme="dark"] {
      --bg:#0D1520;--surface:#162030;--header:#0D1520;--header-b:#1A2B3D;
      --accent:#3B82F6;--accent-h:#60A5FA;--user-bg:#2563EB;--user-txt:#FFFFFF;
      --bot-bg:#1C2D40;--bot-shadow:0 1px 4px rgba(0,0,0,.4);
      --sys-bg:#1C2D40;--sys-txt:#94A3B8;--text:#E2E8F0;--muted:#94A3B8;
      --border:#243447;--fbar:#111D2B;--input-bg:#162030;
      --cite-bg:#1E3A5F;--cite-txt:#93C5FD;--ret-bg:#162030;--ret-border:#1E3A5F;
      --online:#22C55E;--offline:#EF4444;--checking:#F59E0B;
    }

    /* ── 리셋 ───────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* ── 헤더 ───────────────────────────────── */
    header {
      background: var(--header);
      border-bottom: 1px solid var(--header-b);
      padding: 0 20px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }
    .h-left { display: flex; align-items: center; gap: 10px; }
    .h-logo {
      width: 34px; height: 34px; border-radius: 9px;
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; font-size: 1.1rem; flex-shrink: 0;
      cursor: pointer; transition: transform .12s, filter .12s;
    }
    .h-logo:hover  { filter: brightness(1.15); }
    .h-logo:active { transform: scale(.92); }
    .h-title { font-size: .98rem; font-weight: 700; color: #F0F6FF; line-height: 1.2; }
    .h-sub   { font-size: .7rem; color: #7A9AC0; font-weight: 400; }

    .status {
      display: flex; align-items: center; gap: 7px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px; padding: 4px 12px;
      font-size: .75rem; color: #A0B4CC; white-space: nowrap;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--checking); flex-shrink: 0;
    }
    .dot.online  { background: var(--online);  box-shadow: 0 0 5px #22C55E88; }
    .dot.offline { background: var(--offline); box-shadow: 0 0 5px #EF444488; }
    .dot.checking{ animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }


    /* ── 진행바 ─────────────────────────────── */
    .pbar-wrap { height: 2px; background: var(--border); flex-shrink: 0; display: none; }
    .pbar-wrap.on { display: block; }
    .pbar { height: 100%; background: var(--accent); transition: width .18s ease; width: 0; }

    /* ── 채팅 영역 ──────────────────────────── */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .chat::-webkit-scrollbar { width: 5px; }
    .chat::-webkit-scrollbar-track { background: transparent; }
    .chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── 메시지 ─────────────────────────────── */
    .msg { display: flex; gap: 8px; align-items: flex-start; max-width: 84%; }
    .msg.user   { align-self: flex-end;   flex-direction: row-reverse; }
    .msg.bot    { align-self: flex-start; }
    .msg.system { align-self: center; max-width: 100%; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem; flex-shrink: 0; margin-top: 2px;
    }
    .avatar.bot  { background: #DBEAFE; }
    .avatar.user { background: #E0E7FF; color: var(--accent); }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: .9rem;
      line-height: 1.72;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.user  .bubble { background: var(--user-bg); color: var(--user-txt); border-bottom-right-radius: 5px; }
    .msg.bot   .bubble { background: var(--bot-bg);  color: var(--text);     border-bottom-left-radius: 5px; box-shadow: var(--bot-shadow); }
    .msg.system .bubble {
      background: var(--sys-bg); color: var(--sys-txt);
      font-size: .74rem; padding: 5px 13px; border-radius: 12px;
    }

    /* ── 출처 태그 ──────────────────────────── */
    .cite {
      display: inline-block;
      background: var(--cite-bg); color: var(--cite-txt);
      border-radius: 4px; padding: 1px 5px;
      font-size: .76rem; font-weight: 700; margin: 0 1px;
    }

    /* ── 참고 구간 (봇 메시지 하단) ─────────── */
    .ret-wrap { margin-top: 5px; }
    .ret-btn {
      background: none; border: none; cursor: pointer;
      font-size: .72rem; color: var(--accent); padding: 2px 0;
      display: flex; align-items: center; gap: 3px;
    }
    .ret-btn:hover { color: var(--accent-h); }
    .ret-panel {
      display: none;
      margin-top: 4px;
      background: var(--ret-bg); border: 1px solid var(--ret-border);
      border-radius: 8px; padding: 7px 10px;
      font-size: .72rem; color: var(--muted);
    }
    .ret-panel.open { display: block; }
    .ret-row { padding: 2px 0; border-bottom: 1px solid var(--ret-border); }
    .ret-row:last-child { border-bottom: none; }
    .ret-src   { font-weight: 700; color: var(--accent); }
    .ret-score { color: var(--muted); margin-left: 5px; }

    /* ── 타이핑 인디케이터 ──────────────────── */
    .typing { display: flex; align-items: center; gap: 3px; padding: 2px 0; }
    .typing span {
      display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; background: var(--muted);
      animation: bounce .9s ease-in-out infinite;
    }
    .typing span:nth-child(2) { animation-delay: .17s; }
    .typing span:nth-child(3) { animation-delay: .34s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%         { transform: translateY(-6px); }
    }

    /* ── 입력 영역 ──────────────────────────── */
    .input-wrap {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }
    #question {
      flex: 1; min-height: 40px; max-height: 130px;
      border: 1px solid var(--border); border-radius: 12px;
      padding: 9px 13px; font-size: .9rem; font-family: inherit;
      resize: none; outline: none; overflow-y: auto;
      background: var(--input-bg); color: var(--text);
      line-height: 1.55; transition: border-color .15s;
    }
    #question:focus { border-color: var(--accent); }
    #question::placeholder { color: var(--muted); }
    #sendBtn {
      width: 40px; height: 40px; border-radius: 50%;
      border: none; background: var(--accent); color: #fff;
      font-size: 1rem; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s, transform .1s;
    }
    #sendBtn:hover:not(:disabled) { background: var(--accent-h); }
    #sendBtn:active:not(:disabled) { transform: scale(.91); }
    #sendBtn:disabled { background: #93C5FD; cursor: not-allowed; opacity: .7; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ── 문서 편집 버튼 (헤더) ─────────────── */
    .edit-btn {
      display: flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px; padding: 5px 11px;
      font-size: .78rem; font-weight: 600; color: #D0E4FF;
      cursor: pointer; white-space: nowrap;
      transition: background .12s;
    }
    .edit-btn:hover { background: rgba(255,255,255,.18); }

    /* ── 모달 오버레이 ───────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.6); z-index: 1000;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.open { display: flex; }

    @keyframes modal-in {
      from { opacity: 0; transform: translateY(-14px) scale(.97); }
      to   { opacity: 1; transform: none; }
    }

    .modal {
      background: var(--surface); border-radius: 16px;
      width: 100%; max-width: 860px;
      max-height: 88vh;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
      display: flex; flex-direction: column;
      animation: modal-in .18s ease;
    }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 24px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-title { font-size: 1.05rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%; border: none;
      background: var(--bg); color: var(--muted); font-size: 1rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background .12s;
    }
    .modal-close:hover { background: var(--border); color: var(--text); }

    .modal-toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 24px; border-bottom: 1px solid var(--border);
      flex-shrink: 0; background: var(--fbar, var(--bg));
    }
    .modal-body {
      flex: 1; overflow-y: auto; padding: 18px 24px;
      display: flex; flex-direction: column; gap: 12px;
      min-height: 0;
    }
    .modal-footer {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 10px; padding: 14px 24px;
      border-top: 1px solid var(--border); flex-shrink: 0;
      background: var(--fbar, var(--bg));
      border-radius: 0 0 16px 16px;
    }
    .modal-footer-status { font-size: .76rem; color: var(--muted); margin-right: auto; }

    /* 섹션 그룹 */
    .sec-group { display: flex; flex-direction: column; gap: 6px; }
    .sec-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 2px 0 4px; border-bottom: 1px solid var(--border); margin-bottom: 2px;
    }
    .sec-label { font-size: .75rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
    .sec-empty { font-size: .78rem; color: var(--muted); padding: 6px 2px; }

    /* 섹션 관리 패널 */
    .sp-list {
      display: flex; flex-direction: column; gap: 2px;
      max-height: 280px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 8px; padding: 4px;
    }
    .sp-row { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; }
    .sp-row:hover, .sp-row.editing { background: var(--bg); }
    .sp-num { font-weight: 700; color: var(--accent); font-size: .85rem; min-width: 48px; flex-shrink: 0; }
    .sp-label { flex: 1; min-width: 0; font-size: .85rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-count { font-size: .72rem; color: var(--muted); flex-shrink: 0; }
    .sp-input { flex: 1; padding: 4px 8px; font-size: .82rem; }
    .qna-author { font-size: .74rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; margin-top: 5px; }

    /* Q&A 카드 */
    .qna-card {
      border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; background: var(--surface);
    }
    .qna-card-head {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 10px 12px; background: var(--bg);
    }
    .qna-qnum { font-size: .72rem; font-weight: 700; color: var(--accent); flex-shrink: 0; margin-top: 2px; }
    .qna-qtxt { font-size: .88rem; font-weight: 600; color: var(--text); flex: 1; line-height: 1.4; }
    .qna-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .qna-btn {
      border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px;
      font-size: .72rem; font-weight: 600; cursor: pointer;
      background: var(--surface); color: var(--muted);
      transition: all .12s;
    }
    .qna-btn.edit:hover  { border-color: var(--accent); color: var(--accent); }
    .qna-btn.del:hover   { border-color: #EF4444; color: #EF4444; }

    .qna-card-body {
      padding: 8px 12px 10px 28px;
      font-size: .8rem; color: var(--muted);
      line-height: 1.65;
    }
    .qna-card-body .ab { display: flex; gap: 6px; }
    .qna-card-body .ab::before { content: "•"; color: var(--accent); flex-shrink: 0; }

    /* 편집 폼 */
    .edit-form {
      border: 2px solid var(--accent); border-radius: 10px;
      padding: 14px; background: var(--surface);
      display: flex; flex-direction: column; gap: 10px;
    }
    .form-row { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .form-select, .form-input, .form-textarea {
      border: 1px solid var(--border); border-radius: 7px;
      padding: 7px 10px; font-size: .88rem; font-family: inherit;
      background: var(--input-bg); color: var(--text); outline: none;
      transition: border-color .12s; width: 100%;
    }
    .form-select:focus, .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
    .form-textarea { resize: vertical; min-height: 100px; line-height: 1.65; }
    .form-hint { font-size: .7rem; color: var(--muted); }

    .form-btns { display: flex; gap: 8px; justify-content: flex-end; }

    /* 버튼 공용 */
    .btn {
      border: none; border-radius: 8px; padding: 7px 16px;
      font-size: .82rem; font-weight: 600; cursor: pointer;
      transition: opacity .12s, transform .1s;
    }
    .btn:active { transform: scale(.96); }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .88; }
    .btn-ghost { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); }
    .btn-danger { background: #FEF2F2; color: #EF4444; border: 1px solid #FCA5A5; }

    .badge-cnt {
      display: inline-flex; align-items: center; justify-content: center;
      background: #DBEAFE; color: #1D4ED8;
      border-radius: 10px; padding: 1px 7px; font-size: .7rem; font-weight: 700;
    }
    .badge-red {
      display: inline-flex; align-items: center; justify-content: center;
      background: #FEE2E2; color: #DC2626;
      border-radius: 10px; padding: 1px 6px; font-size: .68rem; font-weight: 700;
      margin-left: 4px;
    }

    /* ── 미답변 목록 ───────────────────────── */
    .ua-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 14px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface);
    }
    .ua-meta { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .ua-time { font-size: .7rem; color: var(--muted); }
    .ua-q    { font-size: .88rem; color: var(--text); line-height: 1.5; }
    .ua-del  { border: none; background: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 2px 4px; flex-shrink: 0; }
    .ua-del:hover { color: #EF4444; }

    /* ── 첨부 이미지 (편집 폼) ─────────────────── */
    .img-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
    .img-thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
    .img-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-thumb-del {
      position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
      border-radius: 50%; border: none; background: rgba(0,0,0,.65); color: #fff;
      font-size: .65rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .img-upload-btn {
      display: inline-flex; align-items: center; gap: 5px;
      border: 1px dashed var(--border); border-radius: 8px;
      padding: 6px 12px; font-size: .78rem; color: var(--muted);
      cursor: pointer; width: fit-content;
    }
    .img-upload-btn:hover { border-color: var(--accent); color: var(--accent); }
    .img-upload-btn input { display: none; }

    /* ── 첨부 이미지 (Q&A 카드 보기) ───────────── */
    .qna-img-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .qna-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; }

    /* ── 첨부 이미지 (챗봇 답변) ───────────────── */
    .cited-img-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .cited-img { max-width: 160px; max-height: 160px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; box-shadow: var(--bot-shadow); }
  </style>
</head>
<body>

<!-- 백엔드 주소 — 여기 한 곳만 수정 -->
<!-- 운영 서버가 이 파일을 서빙하면(포트·프록시 무관) 같은 오리진을 쓰고, 로컬 정적 서버(:3002)나 파일로 열면 운영 서버로 붙는다 -->
<script>const BE = (location.port === "3002" || location.protocol === "file:") ? "http://112.160.143.66:8000" : location.origin;</script>

<!-- ── 헤더 ── -->
<header>
  <div class="h-left">
    <div class="h-logo" onclick="location.reload()" title="새로고침" role="button">🏥</div>
    <div>
      <div class="h-title">전산도우미</div>
      <div class="h-sub">정보지원팀 RAG 챗봇</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="edit-btn" onclick="openUnansweredModal()" id="unansweredBtn">❓ 미답변<span class="badge-red" id="unansweredBadge" style="display:none">0</span></button>

<!-- 폴더 바 제거됨 — 백엔드가 Data 폴더를 자동 로딩 -->

<!-- ── 진행바 ── -->
<div class="pbar-wrap" id="pbarWrap"><div class="pbar" id="pbar"></div></div>

<div class="input-wrap">
  <textarea id="question" rows="1"
    placeholder="질문을 입력하세요… (Enter 전송 · Shift+Enter 줄바꿈)"
    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="sendBtn" onclick="sendChat()" title="전송 (Enter)">↑</button>

<script>
/* ════════════════════════════════════════════
   설정
════════════════════════════════════════════ */
const CHUNK_LINES   = 20;
const CHUNK_OVERLAP = 3;
const TOP_K         = 3;
const EMBED_BATCH   = 16;

/* ════════════════════════════════════════════
   전역 상태
════════════════════════════════════════════ */
let vectorStore = null;
let fileChunks  = {};
let msgCount    = 0;

const chatEl = document.getElementById('chat');

/* ════════════════════════════════════════════
   건강 확인
════════════════════════════════════════════ */
async function checkHealth() {
  const dot = document.getElementById('dot');
  const txt = document.getElementById('statusText');
  try {
    const res = await fetch(BE + '/health', { signal: AbortSignal.timeout(4000) });
    if (res.ok) { dot.className = 'dot online';  txt.textContent = '백엔드 연결됨'; }
    else throw 0;
  } catch {
    dot.className = 'dot offline';
    txt.textContent = '연결 안 됨';
  }
}
checkHealth();

/* ════════════════════════════════════════════
   메시지 헬퍼
════════════════════════════════════════════ */
function appendMsg(role, html) {
  const id  = 'msg-' + (++msgCount);
  const div = document.createElement('div');
  div.id    = id;
  div.className = 'msg ' + role;

  if (role === 'user') {
    div.innerHTML = `
      <div class="avatar user">👤</div>
      <div class="bubble">${escHtml(html)}</div>`;
  } else if (role === 'bot') {
    div.innerHTML = `
      <div class="avatar bot">🤖</div>
      <div style="min-width:0;flex:1" id="${id}-wrap">
        <div class="bubble" id="${id}-b">${html}</div>
        <div class="ret-wrap" id="${id}-ret" style="display:none"></div>
      </div>`;
  } else {
    div.innerHTML = `<div class="bubble">${html}</div>`;
  }

  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return id;
}

function updateBubble(id, html) {
  const el = document.getElementById(id + '-b')
           ?? document.getElementById(id)?.querySelector('.bubble');
  if (!el) return;
  el.innerHTML = html;
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showRetrieval(id, hits) {
  const wrap = document.getElementById(id + '-ret');
  if (!wrap || !hits.length) return;
  const rows = hits.map((h, i) => {
    const src = h.chunk.isQna
      ? `<b>${h.chunk.qId}</b> — ${escHtml(displaySection(h.chunk.section))}`
      : `${h.chunk.file} ${h.chunk.startLine}~${h.chunk.endLine}줄`;
    return `<div class="ret-row"><span class="ret-src">[${i+1}] ${src}</span><span class="ret-score">${(h.score*100).toFixed(1)}%</span></div>`;
  }).join('');
  wrap.style.display = 'block';
  wrap.innerHTML = `
    <button class="ret-btn" onclick="toggleRet('${id}')">📎 참고 구간 ${hits.length}건 ▾</button>
    <div class="ret-panel" id="${id}-rp">${rows}</div>`;
}

/* 답변에 인용된 [Qn]의 첨부 이미지 추출 */
function extractCitedImages(raw, hits) {
  const cited = new Set([...raw.matchAll(/\[(Q\d+)\]/g)].map(m => m[1]));
  const imgs = [], seen = new Set();
  for (const h of hits) {
    if (h.chunk.isQna && cited.has(h.chunk.qId) && h.chunk.images && h.chunk.images.length) {
      for (const fn of h.chunk.images) {
        if (!seen.has(fn)) { seen.add(fn); imgs.push(fn); }
      }
    }
  }
  return imgs;
}

function showCitedImages(id, filenames) {
  const wrap = document.getElementById(id + '-wrap');
  if (!wrap || !filenames.length) return;
  const row = document.createElement('div');
  row.className = 'cited-img-row';
  row.innerHTML = filenames.map(fn =>
    `<img src="${BE}/images/${encodeURIComponent(fn)}" class="cited-img" onclick="window.open('${BE}/images/${encodeURIComponent(fn)}','_blank')" alt="참고 이미지"/>`
  ).join('');
  wrap.appendChild(row);
}

/* 이미지 업로드 */
async function uploadImage(file) {
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(BE + '/api/upload-image', { method: 'POST', body: fd });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `업로드 실패 ${res.status}`);
  }
  return await res.json();
}

function toggleRet(id) {
  const p = document.getElementById(id + '-rp');
  if (!p) return;
  const open = p.classList.toggle('open');
  const btn  = document.querySelector(`#${id}-ret .ret-btn`);
  if (btn) btn.textContent = `📎 참고 구간 ${p.children.length}건 ${open ? '▴' : '▾'}`;
}

// 속성값(value="…", title="…")에도 쓰이므로 따옴표까지 이스케이프
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function highlightCites(raw) {
  return escHtml(raw)
    .replace(/\n/g, '<br>')
    .replace(/\[(Q\d+)\]/g, '<span class="cite">[$1]</span>')
    .replace(/\[([^\]]+?\d+~\d+줄)\]/g, '<span class="cite">[$1]</span>');
}

/* ════════════════════════════════════════════
   청킹
════════════════════════════════════════════ */
function chunkLines(filename, lines) {
  const chunks = [], step = CHUNK_LINES - CHUNK_OVERLAP;
  for (let s = 0; s < lines.length; s += step) {
    const e = Math.min(s + CHUNK_LINES, lines.length);
    const sl = lines.slice(s, e);
    chunks.push({
      file: filename, startLine: s+1, endLine: e,
      text:    sl.join('\n'),
      display: sl.map((l, i) => `${s+i+1}: ${l}`).join('\n'),
    });
    if (e >= lines.length) break;
  }
  return chunks;
}

/* ════════════════════════════════════════════
   벡터 스토어
════════════════════════════════════════════ */
class VectorStore {
  constructor() { this.chunks = []; this.vectors = []; }
  add(c, v)  { this.chunks.push(c); this.vectors.push(v); }
  _cos(a, b) {
    let d=0,na=0,nb=0;
    for (let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}
    return d/(Math.sqrt(na)*Math.sqrt(nb)+1e-8);
  }
  search(q, k=TOP_K) {
    return this.chunks
      .map((c,i)=>({chunk:c, score:this._cos(q,this.vectors[i])}))
      .sort((a,b)=>b.score-a.score).slice(0,k);
  }
}

/* ════════════════════════════════════════════
   임베딩 API
════════════════════════════════════════════ */
async function embedTexts(texts) {
  const res = await fetch(BE + '/api/embed', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({texts}),
  });
  if (!res.ok) throw new Error(`임베딩 오류 ${res.status}`);
  return (await res.json()).embeddings;
}

/* ════════════════════════════════════════════
   자동 데이터 로딩 (페이지 로드 시 호출)
════════════════════════════════════════════ */
async function autoLoadData() {
  const pWrap = document.getElementById('pbarWrap');
  const pBar  = document.getElementById('pbar');
  pWrap.classList.add('on');
  pBar.style.width = '5%';

  const sysId = appendMsg('system', '📂 참고자료 자동 로딩 중…');

  let files;
  try {
    const res = await fetch(BE + '/api/load-data');
    if (!res.ok) throw new Error(`서버 오류 ${res.status}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    files = data.files;
  } catch(err) {
    updateBubble(sysId, `❌ 데이터 로딩 실패: ${escHtml(err.message)}`);
    pWrap.classList.remove('on');
    return;
  }

  /* 파일 → 청크 변환 */
  const allChunks = [];
  let totalFiles = 0;
  for (const f of files) {
    if (f.type === 'error') {
      appendMsg('system', `⚠️ ${escHtml(f.filename)}: ${escHtml(f.error)}`);
      continue;
    }
    if (f.type === 'qna') {
      for (const it of f.items) {
        if (isPlaceholder(it)) continue;  // 빈 섹션 자리표시는 챗봇 검색에서 제외
        // 등록자 마커는 검색·답변 근거에서 제외
        const text = it.text.split('\n').filter(l => !/^-\s*\[BY:.*\]$/.test(l)).join('\n');
        allChunks.push({
          file: f.filename, startLine: it.id, endLine: it.id,
          text, display: text,
          qId: it.id, section: it.section, isQna: true,
          images: it.images || [],
        });
      }
    } else if (f.type === 'pdf') {
      const lines = [];
      for (const { page, lines: ls } of f.pages) { lines.push(`[${page}페이지]`); lines.push(...ls); }
      allChunks.push(...chunkLines(f.filename, lines));
    } else if (f.type === 'text') {
      allChunks.push(...chunkLines(f.filename, f.lines));
    }
    totalFiles++;
  }

  if (!allChunks.length) {
    updateBubble(sysId, '⚠️ Data 폴더에서 읽을 수 있는 파일이 없습니다.');
    pWrap.classList.remove('on');
    return;
  }

  /* 임베딩 */
  vectorStore = new VectorStore();
  const total = allChunks.length;
  try {
    for (let i = 0; i < total; i += EMBED_BATCH) {
      const batch = allChunks.slice(i, i + EMBED_BATCH);
      const done  = Math.min(i + EMBED_BATCH, total);
      pBar.style.width = Math.round(5 + (done / total) * 95) + '%';
      updateBubble(sysId, `🔢 임베딩 중… (${done}/${total}청크)`);
      const vecs = await embedTexts(batch.map(c => c.text));
      for (let j = 0; j < batch.length; j++) vectorStore.add(batch[j], vecs[j]);
    }
    pBar.style.width = '100%';
    setTimeout(() => { pWrap.classList.remove('on'); pBar.style.width = '0'; }, 700);
    updateBubble(sysId, `✅ 준비 완료 — ${totalFiles}개 파일 · ${total}개 청크 (bge-m3)`);
    appendMsg('bot', '안녕하세요! 정보지원팀 <b>전산도우미</b>입니다.\n전산 장애 관련 질문을 입력해 주세요.');
  } catch(err) {
    updateBubble(sysId, `❌ 임베딩 실패: ${escHtml(err.message)}`);
    vectorStore = null;
    setTimeout(() => pWrap.classList.remove('on'), 600);
  }
}

/* ════════════════════════════════════════════
   자동 리사이즈
════════════════════════════════════════════ */
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130)+'px';
}

/* ════════════════════════════════════════════
   단축키
════════════════════════════════════════════ */
function handleKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
}

/* ════════════════════════════════════════════
   전송 + RAG + SSE
════════════════════════════════════════════ */
async function sendChat() {
  const qEl   = document.getElementById('question');
  const question = qEl.value.trim();
  if (!question) return;
  if (!vectorStore) {
    appendMsg('system','⚠️ 먼저 참고자료 폴더를 선택해 주세요.');
    return;
  }

  qEl.value = '';
  autoResize(qEl);
  document.getElementById('sendBtn').disabled = true;

  appendMsg('user', question);

  /* 질문 임베딩 + 검색 */
  let hits;
  try {
    const [qVec] = await embedTexts([question]);
    hits = vectorStore.search(qVec, TOP_K);
  } catch(err) {
    appendMsg('system', `⚠️ 임베딩 오류: ${escHtml(err.message)}`);
    document.getElementById('sendBtn').disabled = false;
    return;
  }

  /* 컨텍스트 */
  const context = hits.map((h,i) => {
    const hdr = h.chunk.isQna
      ? `[구간 ${i+1}] 파일: ${h.chunk.file} · ${h.chunk.qId} (${displaySection(h.chunk.section)})`
      : `[구간 ${i+1}] 파일: ${h.chunk.file} · ${h.chunk.startLine}~${h.chunk.endLine}줄`;
    return `${hdr}\n${h.chunk.display}`;
  }).join('\n\n');

  /* 봇 버블 생성 */
  const botId = appendMsg('bot', '<div class="typing"><span></span><span></span><span></span></div>');

  /* SSE 스트리밍 */
  try {
    const res = await fetch(BE + '/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question, context }),
    });
    if (!res.ok) throw new Error(`서버 오류 ${res.status}`);

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf='', raw='', first=true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream:true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith('data:')) continue;
        const d = ln.slice(5).trim();
        if (d==='[DONE]') break;
        try {
          const { token } = JSON.parse(d);
          if (token) {
            if (first) { raw=''; first=false; }
            raw += token;
            updateBubble(botId, highlightCites(raw));
          }
        } catch {}
      }
    }
    if (first) updateBubble(botId, '(응답 없음)');
    showRetrieval(botId, hits);
    showCitedImages(botId, extractCitedImages(raw, hits));
    // 미답변 감지 — "확인되지 않습니다" 포함 시 키워드 저장
    if (raw.includes('확인되지 않습니다')) {
      saveUnanswered(question);
      appendMsg('system', `📋 미답변 키워드 저장됨: "${escHtml(question)}"`);
    }
  } catch(err) {
    updateBubble(botId, `⚠️ 오류: ${escHtml(err.message)}`);
  } finally {
    document.getElementById('sendBtn').disabled = false;
    qEl.focus();
  }
}

/* ════════════════════════════════════════════
   Q&A 문서 편집기
════════════════════════════════════════════ */
let editorItems = [];   // 편집 중인 Q&A 배열 (객체 참조)
let formImagesMap = {}; // 편집 폼별 첨부 이미지 임시 저장 { containerId: [filename,...] }

const ROMAN = ['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ','Ⅹ'];
const ROMAN_TENS = ['', 'Ⅹ', 'ⅩⅩ', 'ⅩⅩⅩ', 'ⅩⅬ', 'Ⅼ', 'ⅬⅩ', 'ⅬⅩⅩ', 'ⅬⅩⅩⅩ', 'ⅩⅭ'];
const MAX_SECTIONS = 99;
const BY_RE = /^\[BY:(.*)\]$/;
// 서버 파서는 Q&A가 없는 섹션 제목을 버리므로, 빈 섹션에는 숨김용 자리표시 항목을 하나 넣어 저장한다
const EMPTY_MARK = '[EMPTY_SECTION]';
const EMPTY_Q = '(빈 섹션 — Q&A 없음)';
const isPlaceholder = it => (it.answer_lines || []).includes(EMPTY_MARK) || (it.text || '').includes(EMPTY_MARK);

// 1~10은 기존 문서와 같은 단일 문자(Ⅱ 등), 11 이상은 조합(ⅩⅠ, ⅩⅬ, ⅩⅭⅨ)
function toRoman(n) {
  if (n <= 10) return ROMAN[n - 1];
  return ROMAN_TENS[Math.floor(n / 10)] + (n % 10 ? ROMAN[n % 10 - 1] : '');
}

// 문서에는 로마 숫자로 저장(서버 파서가 Ⅰ~Ⅹ 첫 글자로 섹션을 인식)하고, 화면에만 01~99로 보여준다
const ROMAN_TO_NUM = new Map(Array.from({ length: MAX_SECTIONS }, (_, i) => [toRoman(i + 1), i + 1]));

function displayNum(roman) {
  const n = ROMAN_TO_NUM.get(roman);
  return n ? String(n).padStart(2, '0') : roman;
}

function displaySection(name) {
  const { num, label } = splitSection(name);
  return num ? `${displayNum(num)}. ${label}` : name;
}

// 빈 섹션은 문서에 저장되지 않아 번호에 빈칸이 생길 수 있으므로, 안 쓰는 번호를 고른다
function nextSectionPrefix() {
  const used = new Set(SECTIONS.map(s => splitSection(s).num));
  for (let n = SECTIONS.length + 1; n <= MAX_SECTIONS; n++) {
    if (!used.has(toRoman(n))) return toRoman(n);
  }
  return null;
}

function splitSection(name) {
  const m = name.match(/^([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩⅬⅭ]+)\.\s*(.*)$/);
  return m ? { num: m[1], label: m[2] } : { num: '', label: name };
}

function renderImgList(containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const images = formImagesMap[containerId] || [];
  if (!images.length) {
    el.innerHTML = '<span class="form-hint">첨부된 이미지가 없습니다.</span>';
    return;
  }
  el.innerHTML = images.map((fn, i) => `
    <div class="img-thumb">
      <img src="${BE}/images/${encodeURIComponent(fn)}" alt="첨부 이미지"/>
      <button type="button" class="img-thumb-del" onclick="removeFormImage('${containerId}', ${i})">✕</button>
    </div>`).join('');
}

function removeFormImage(containerId, idx) {
  formImagesMap[containerId].splice(idx, 1);
  renderImgList(containerId);
}

async function handleImgInput(containerId, inputEl) {
  const files = Array.from(inputEl.files || []);
  inputEl.value = '';
  formImagesMap[containerId] = formImagesMap[containerId] || [];
  for (const file of files) {
    try {
      const { filename } = await uploadImage(file);
      formImagesMap[containerId].push(filename);
    } catch(err) {
      alert('이미지 업로드 실패: ' + err.message);
    }
  }
  renderImgList(containerId);
}

const DEFAULT_SECTIONS = [
  "Ⅰ. PC·단말기 관련",
  "Ⅱ. 네트워크 관련",
  "Ⅲ. 프린터·주변기기 관련",
  "Ⅳ. 병원정보시스템(OCS·EMR·PACS 등) 관련",
  "Ⅴ. 서버·전원 관련",
  "Ⅵ. 보안 관련",
];
let SECTIONS = [...DEFAULT_SECTIONS];

async function openEditor() {
  document.getElementById('editorOverlay').classList.add('open');
  document.getElementById('editorStatus').textContent = '';
  document.getElementById('editorBody').innerHTML =
    '<div style="text-align:center;padding:40px;color:var(--muted)">불러오는 중…</div>';

  try {
    const res = await fetch(BE + '/api/qna');
    if (!res.ok) throw new Error('서버 오류 ' + res.status);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const docSections = [...new Set(data.items.map(it => it.section))];  // 자리표시 항목 포함 → 빈 섹션 순서도 유지
    editorItems = data.items.filter(it => !isPlaceholder(it)).map((it, i) => {
      const lines = it.answer_lines || [];
      const byLine = lines.find(l => BY_RE.test(l));
      return {
        ...it,
        answer_lines: lines.filter(l => !BY_RE.test(l)),
        author: byLine ? byLine.match(BY_RE)[1].trim() : '',
        _key: i,
      };
    });
    SECTIONS = docSections.length ? docSections : [...DEFAULT_SECTIONS];
    sectionPanelOpen = false;
    panelEditIdx = -1;
    renderEditor();
  } catch(err) {
    document.getElementById('editorBody').innerHTML =
      `<div style="color:#EF4444;padding:20px">❌ 불러오기 실패: ${escHtml(err.message)}</div>`;
  }
}

// 섹션 변경이 저장됐으면 창을 닫을 때 한 번만 재색인 (변경마다 재색인하면 채팅창에 안내가 반복됨)
async function closeEditor() {
  document.getElementById('editorOverlay').classList.remove('open');
  while (sectionSaving) await new Promise(r => setTimeout(r, 200));
  if (needsReindex) {
    needsReindex = false;
    appendMsg('system', '💾 섹션 변경 반영 — 재색인 시작');
    await autoLoadData();
  }
}
function overlayClick(e) {
  if (e.target === document.getElementById('editorOverlay')) closeEditor();
}

/* 전체 렌더 */
function renderEditor() {
  document.getElementById('qnaCount').textContent = editorItems.length;

  // 섹션별 그룹
  const groups = {};
  SECTIONS.forEach(s => { groups[s] = []; });
  editorItems.forEach(it => {
    if (!groups[it.section]) groups[it.section] = [];
    groups[it.section].push(it);
  });

  let q = 1;
  const body = document.getElementById('editorBody');
  body.innerHTML = '';

  SECTIONS.forEach((sec, idx) => {
    const arr = groups[sec] || [];

    const grp = document.createElement('div');
    grp.className = 'sec-group';
    grp.id = 'sec-' + idx;
    grp.innerHTML = `
      <div class="sec-head">
        <span class="sec-label">${escHtml(displaySection(sec))}</span>
      </div>
      ${arr.length ? '' : '<div class="sec-empty">항목 없음</div>'}`;

    arr.forEach(it => {
      const card = document.createElement('div');
      card.className = 'qna-card';
      card.id = 'card-' + it._key;
      card.innerHTML = `
        <div class="qna-card-head">
          <span class="qna-qnum">Q${q}</span>
          <span class="qna-qtxt">${escHtml(it.question)}</span>
          ${it.author ? `<span class="qna-author">등록자: ${escHtml(it.author)}</span>` : ''}
          <div class="qna-actions">
            <button class="qna-btn edit" onclick="startEdit(${it._key})">✏️ 수정</button>
            <button class="qna-btn del"  onclick="deleteItem(${it._key})">🗑️</button>
          </div>
        </div>
        <div class="qna-card-body">
          ${(it.answer_lines||[]).map(l => `<div class="ab">${escHtml(l)}</div>`).join('')}
          ${(it.images && it.images.length) ? `<div class="qna-img-row">${it.images.map(fn =>
            `<img src="${BE}/images/${encodeURIComponent(fn)}" class="qna-thumb" onclick="window.open('${BE}/images/${encodeURIComponent(fn)}','_blank')" alt="첨부 이미지"/>`
          ).join('')}</div>` : ''}
        </div>`;
      grp.appendChild(card);
      q++;
    });

    body.appendChild(grp);
  });

  if (sectionPanelOpen) body.insertBefore(buildSectionPanel(), body.firstChild);
}

/* 삭제 */
function deleteItem(key) {
  if (!confirm('이 항목을 삭제하시겠습니까?')) return;
  editorItems = editorItems.filter(x => x._key !== key);
  renderEditor();
}

/* 섹션 이름 변경 (섹션 관리 패널에서 사용) */
function renameSectionAt(idx, rawLabel) {
  const label = rawLabel.trim();
  if (!label) { alert('섹션명을 입력해 주세요.'); return false; }
  const oldName = SECTIONS[idx];
  const { num } = splitSection(oldName);
  const newName = num ? `${num}. ${label}` : label;
  if (newName !== oldName && SECTIONS.includes(newName)) { alert('이미 존재하는 섹션입니다.'); return false; }
  applySectionRenames(new Map([[oldName, newName]]));
  return true;
}

/* 섹션 삭제 — 항목이 남아 있으면 막는다 */
function deleteSection(idx) {
  const name = SECTIONS[idx];
  const count = editorItems.filter(it => it.section === name).length;
  if (count) {
    alert(`이 섹션에 Q&A ${count}개가 있어 삭제할 수 없습니다.\n항목을 다른 섹션으로 옮기거나 먼저 삭제해 주세요.`);
    return;
  }
  if (!confirm(`"${displaySection(name)}" 섹션을 삭제하시겠습니까?`)) return;
  SECTIONS.splice(idx, 1);
  renumberSections();
  panelEditIdx = -1;
  renderEditor();
  saveSectionChange();
}

// 삭제 후 번호가 비지 않도록 Ⅰ부터 다시 매긴다
function renumberSections() {
  const renames = new Map();
  SECTIONS.forEach((name, i) => {
    const { num, label } = splitSection(name);
    const next = `${toRoman(i + 1)}. ${label}`;
    if (num && next !== name) renames.set(name, next);
  });
  applySectionRenames(renames);
}

// 여러 이름을 한 번에 바꿔야 연쇄 치환(Ⅳ→Ⅲ→Ⅱ)이 생기지 않는다
function applySectionRenames(renames) {
  if (!renames.size) return;
  SECTIONS = SECTIONS.map(s => renames.get(s) ?? s);
  editorItems.forEach(it => { if (renames.has(it.section)) it.section = renames.get(it.section); });
}

/* 섹션 관리 패널 (추가 + 목록에서 수정·삭제) */

// renderEditor가 본문을 다시 그릴 때마다 맨 위에 다시 붙인다
function buildSectionPanel() {
  const prefix = nextSectionPrefix();
  const rows = SECTIONS.map((sec, idx) => {
    const { num, label } = splitSection(sec);
    const numHtml = `<span class="sp-num">${num ? escHtml(displayNum(num)) + '.' : ''}</span>`;

      return `<div class="sp-row editing">
        ${numHtml}
        <input class="form-input sp-input" id="sp-edit-input" value="${escHtml(label)}"
               onkeydown="if(event.key==='Enter')applyPanelEdit(${idx});if(event.key==='Escape')cancelPanelEdit()" />
        <button class="qna-btn" onclick="cancelPanelEdit()">취소</button>
        <button class="qna-btn edit" onclick="applyPanelEdit(${idx})">저장</button>
      </div>`;
    }
    const count = editorItems.filter(it => it.section === sec).length;
    return `<div class="sp-row">
      ${numHtml}
      <span class="sp-label" title="${escHtml(label)}">${escHtml(label)}</span>
      <span class="sp-count">${count}개</span>
      <button class="qna-btn edit" onclick="startPanelEdit(${idx})">✏️ 수정</button>

  }).join('');

  const panel = document.createElement('div');
  panel.className = 'edit-form';
  panel.id = 'new-sec-form';
  panel.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:.82rem;font-weight:700;color:var(--accent)">📁 섹션 관리</span>
      <span class="sp-count">${SECTIONS.length} / ${MAX_SECTIONS}</span>
    </div>
    <div class="form-row">
      <label class="form-label">새 섹션명</label>
      ${prefix ? `
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-weight:700;color:var(--accent);font-size:1rem;flex-shrink:0">${escHtml(displayNum(prefix))}.</span>
        <input class="form-input" id="nf-sec-name" placeholder="예: 기타 관련" style="flex:1"
               onkeydown="if(event.key==='Enter')applyAddSection()" />
        <button class="btn btn-primary" onclick="applyAddSection()">섹션 추가</button>
      </div>
      <span class="form-hint">자동으로 "${escHtml(displayNum(prefix))}. 입력값" 형식으로 생성됩니다.</span>`
      : `<span class="form-hint">섹션은 최대 ${MAX_SECTIONS}개까지 만들 수 있습니다.</span>`}
    </div>
    <div class="form-row">
      <label class="form-label">등록된 섹션</label>
      <div class="sp-list">${rows || '<span class="form-hint">섹션이 없습니다.</span>'}</div>
      <span class="form-hint">추가·수정·삭제는 바로 서버 문서에 저장됩니다.<br>Q&A가 들어 있는 섹션은 항목을 옮기거나 지운 뒤 삭제할 수 있습니다.</span>
    </div>
    <div class="form-btns">
      <button class="btn btn-ghost" onclick="closeSectionPanel()">닫기</button>
    </div>`;
  return panel;
}

function startPanelEdit(idx) {
  panelEditIdx = idx;
  renderEditor();
  const input = document.getElementById('sp-edit-input');
  if (input) { input.focus(); input.select(); }
}

function cancelPanelEdit() {
  panelEditIdx = -1;

}

function applyPanelEdit(idx) {
  const before = SECTIONS[idx];
  if (!renameSectionAt(idx, document.getElementById('sp-edit-input').value)) return;
  panelEditIdx = -1;
  renderEditor();
  if (SECTIONS[idx] !== before) saveSectionChange();
}

function applyAddSection() {
  const prefix = nextSectionPrefix();
  if (!prefix) { alert(`섹션은 최대 ${MAX_SECTIONS}개까지 만들 수 있습니다.`); return; }
  const desc = document.getElementById('nf-sec-name').value.trim();
  if (!desc) { alert('섹션명을 입력해 주세요.'); return; }
  const fullName = `${prefix}. ${desc}`;
  if (SECTIONS.includes(fullName)) { alert('이미 존재하는 섹션입니다.'); return; }
  SECTIONS.push(fullName);
  renderEditor();
  document.getElementById('nf-sec-name')?.focus();
  saveSectionChange();
}

/* 서버 문서에 현재 편집 내용 저장 */
async function postQnaSave() {
  // 섹션 순서대로 묶어서 보내야 문서에서 한 섹션이 둘로 쪼개지지 않는다
  const ordered = [
    ...SECTIONS.flatMap(sec => {
      const its = editorItems.filter(it => it.section === sec);
      return its.length ? its : [{ section: sec, question: EMPTY_Q, answer_lines: [EMPTY_MARK], images: [], author: '' }];
    }),
    ...editorItems.filter(it => !SECTIONS.includes(it.section)),
  ];
  const res = await fetch(BE + '/api/qna/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      items: ordered.map(({ section, question, answer_lines, images, author }) => ({
        section, question,
        answer_lines: author ? [...answer_lines, `[BY:${author}]`] : answer_lines,
        images: images || [],
      }))
    }),
  });
  if (res.status === 401) throw new Error('저장 권한이 없습니다 (로그인 필요)');
  if (!res.ok) throw new Error('서버 오류 ' + res.status);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

/* 섹션 변경 즉시 저장 — 연속으로 바꿔도 요청이 겹치지 않게 한 번에 하나씩 */
let needsReindex = false;
let sectionSaving = false;
let sectionSavePending = false;

async function saveSectionChange() {
  if (sectionSaving) { sectionSavePending = true; return; }
  sectionSaving = true;
  const status = document.getElementById('editorStatus');
  try {
    do {
      sectionSavePending = false;
      status.textContent = '섹션 변경 저장 중…';
      await postQnaSave();
      needsReindex = true;
      status.textContent = `✅ 섹션 변경 저장됨 (섹션 ${SECTIONS.length}개 · Q&A ${editorItems.length}건)`;
    } while (sectionSavePending);
  } catch(err) {
    sectionSavePending = false;
    status.textContent = `❌ 섹션 저장 실패: ${err.message} — '저장 및 재색인'으로 다시 시도하세요`;
  } finally {
    sectionSaving = false;
  }
}

/* 전체 저장 + 재색인 */
async function saveAll() {
  const btn    = document.getElementById('saveAllBtn');
  const status = document.getElementById('editorStatus');
  btn.disabled = true;
  status.textContent = '저장 중…';

  try {
    while (sectionSaving) await new Promise(r => setTimeout(r, 200));  // 섹션 즉시 저장과 겹치지 않게
    await postQnaSave();
    const count = editorItems.length;
    status.textContent = `✅ 저장 완료 (${count}건) — 재색인 중…`;
    needsReindex = false;  // 아래에서 직접 재색인하므로 closeEditor의 재색인은 건너뜀
    closeEditor();
    appendMsg('system', `💾 문서 저장 완료 (${count}건) — 재색인 시작`);
    await autoLoadData();
  } catch(err) {
    status.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false;
  }
}

  updateUnansweredBadge();
}

function updateUnansweredBadge() {
  const badge = document.getElementById('unansweredBadge');
  if (!badge) return;
  if (unansweredList.length > 0) {
    badge.textContent = unansweredList.length;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }
}

function openUnansweredModal() {
  renderUnansweredBody();
  document.getElementById('unansweredOverlay').classList.add('open');
}

function closeUnansweredModal() {
  document.getElementById('unansweredOverlay').classList.remove('open');
}

function renderUnansweredBody() {
  const body = document.getElementById('unansweredBody');
  const count = document.getElementById('unansweredCount');
  count.textContent = unansweredList.length;
  if (!unansweredList.length) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">미답변 항목이 없습니다.</div>';
    return;
  }
  body.innerHTML = unansweredList.map((it, i) => `
    <div class="ua-item">
      <div class="ua-meta">
        <span class="ua-time">${escHtml(it.time)}</span>
        <span class="ua-q">${escHtml(it.q)}</span>
      </div>
      <button class="ua-del" onclick="deleteUnanswered(${i})" title="삭제">✕</button>
    </div>`).join('');
}

function deleteUnanswered(idx) {
  unansweredList.splice(idx, 1);
  localStorage.setItem('it_unanswered', JSON.stringify(unansweredList));
  updateUnansweredBadge();
  renderUnansweredBody();
}

function clearAllUnanswered() {
  if (!confirm('미답변 목록을 전체 삭제하시겠습니까?')) return;
  unansweredList = [];
  localStorage.setItem('it_unanswered', JSON.stringify(unansweredList));
  updateUnansweredBadge();
  renderUnansweredBody();
}

/* ════════════════════════════════════════════
   페이지 로드 시 자동 데이터 로딩
════════════════════════════════════════════ */
updateUnansweredBadge();
autoLoadData();
</script>
</body>
</html>
